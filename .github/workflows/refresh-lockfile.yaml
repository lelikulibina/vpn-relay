name: Refresh Cargo.lock

on:
  push:
    branches: ["refactor/**"]
    paths:
      - "Cargo.toml"

permissions:
  contents: write
  actions: write

concurrency:
  group: cargo-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${GITHUB_REF_NAME}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate and commit lockfile
        id: lock
        run: |
          cargo generate-lockfile
          if git diff --quiet -- Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh Cargo.lock"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch locked CI
        if: steps.lock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run ci.yaml --ref "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
