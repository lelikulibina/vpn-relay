[package]
name = "vpn-relay"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Linux multi-tunnel router daemon for BoringTun and AmneziaWG"

[lib]
path = "src/lib.rs"

[[bin]]
name = "vpn-relay"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
boringtun = { git = "https://github.com/lelikulibina/boringtun-awg", rev = "f582d808b4ee8cc0b689629f2ed5a26dc2555c96", version = "0.7.1", features = ["device"] }
libc = "0.2"
nftables = "=0.6.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "0.8.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

